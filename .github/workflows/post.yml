name: post
# Publica el post que toca de la cola state/cola/<tipo>/ (bot/cola.py). No usa la API de Claude: la cola la llena
# cada domingo una tarea programada de Claude. Si la cola de ese horario está vacía, no publica (aviso "Cola vacía").
on:
  schedule:
    - cron: "0 15 * * *"   # 09:00 México -> tipo 1 (imagen + Síguenos)
    - cron: "0 19 * * *"   # 13:00 México -> tipo 2 (imagen de un libro + palabra clave)
    - cron: "0 0 * * *"    # 18:00 México -> tipo 3 ("Ecuación del día" + Síguenos)
    - cron: "0 2 * * *"    # 20:00 México -> tipo 4 (imagen + Síguenos)
  workflow_dispatch:
    inputs:
      type: { description: "Tipo de post 1-4", required: true, default: "1" }
      dry: { description: "true = no publicar", required: false, default: "false" }
concurrency: bot
permissions: { contents: write }
jobs:
  post:
    runs-on: ubuntu-24.04
    env:
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      PAGE_HANDLE: ${{ vars.PAGE_HANDLE }}
    steps:
      - uses: actions/checkout@v5
      - name: Elegir tipo
        run: |
          case "${{ github.event.schedule }}" in
            "0 15 * * *") T=1;; "0 19 * * *") T=2;; "0 0 * * *") T=3;; "0 2 * * *") T=4;;
            *) T="${{ github.event.inputs.type }}";;
          esac
          echo "T=$T" >> $GITHUB_ENV
      - name: Revisar la cola
        # Con la cola vacía no se instala nada: aviso "Cola vacía" y SKIP=1 (python del sistema, sin dependencias)
        run: python3 -m bot.cola revisar $T
      - uses: actions/setup-python@v6
        if: ${{ env.SKIP != '1' }}
        with: { python-version: "3.12", cache: pip }
      - name: Caché de Chromium
        if: ${{ env.SKIP != '1' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - if: ${{ env.SKIP != '1' }}
        run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Renderizar
        if: ${{ env.SKIP != '1' }}
        run: |
          set -o pipefail
          python -u -m bot.main --type $T ${{ github.event.inputs.dry == 'true' && '--dry' || '' }} 2>&1 | tee gen.txt
          { echo '```'; cat gen.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Guardar imágenes de prueba
        if: ${{ github.event.inputs.dry == 'true' && env.SKIP != '1' }}
        uses: actions/upload-artifact@v6
        with:
          name: imagenes-prueba
          path: out/
      - name: Subir imágenes a rama media (URLs públicas para Meta)
        if: ${{ github.event.inputs.dry != 'true' && env.SKIP != '1' }}
        run: |
          cd out && git init -q && git checkout -q -b media
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A . ':!urls.json' ':!post.json' && git commit -qm "media"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          sleep 10
      - name: Publicar en IG, FB y Threads
        if: ${{ github.event.inputs.dry != 'true' && env.SKIP != '1' }}
        run: python -m bot.main --publish-step
        env: { GITHUB_REPOSITORY: "${{ github.repository }}" }
      - name: Guardar estado (registro del post y su salida de la cola)
        if: ${{ github.event.inputs.dry != 'true' && env.SKIP != '1' }}
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A state && git commit -qm "state" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
