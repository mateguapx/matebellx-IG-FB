name: post
on:
  schedule:
    - cron: "0 15 * * *"   # 09:00 México -> tipo 1 (imagen viral + Síguenos)
    - cron: "0 19 * * *"   # 13:00 México -> tipo 2 (imagen de un libro + palabra clave)
    - cron: "0 0 * * *"    # 18:00 México -> tipo 3 (reto básico + Síguenos)
    - cron: "0 2 * * *"    # 20:00 México -> tipo 4 (imagen de un libro + palabra clave)
  workflow_dispatch:
    inputs:
      type: { description: "Tipo de post 1-4", required: true, default: "1" }
      dry: { description: "true = no publicar", required: false, default: "false" }
concurrency: bot
permissions: { contents: write }
jobs:
  post:
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      PAGE_HANDLE: ${{ vars.PAGE_HANDLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Elegir tipo
        run: |
          case "${{ github.event.schedule }}" in
            "0 15 * * *") T=1;; "0 19 * * *") T=2;; "0 0 * * *") T=3;; "0 2 * * *") T=4;;
            *) T="${{ github.event.inputs.type }}";;
          esac
          echo "T=$T" >> $GITHUB_ENV
      - name: Generar y renderizar
        run: |
          set -o pipefail
          python -u -m bot.main --type $T ${{ github.event.inputs.dry == 'true' && '--dry' || '' }} 2>&1 | tee gen.txt
          { echo '```'; cat gen.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Guardar imágenes de prueba
        if: ${{ github.event.inputs.dry == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: imagenes-prueba
          path: out/
      - name: Subir imágenes a rama media (URLs públicas para Meta)
        if: ${{ github.event.inputs.dry != 'true' }}
        run: |
          cd out && git init -q && git checkout -q -b media
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A . ':!urls.json' ':!post.json' && git commit -qm "media"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          sleep 10
      - name: Publicar en IG y FB
        if: ${{ github.event.inputs.dry != 'true' }}
        run: python -m bot.main --publish-step
        env: { GITHUB_REPOSITORY: "${{ github.repository }}" }
      - name: Guardar estado
        if: ${{ github.event.inputs.dry != 'true' }}
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add state && git commit -qm "state" || true
          git pull --rebase -q && git push -q || true
