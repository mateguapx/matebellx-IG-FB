name: ideas
# Cada domingo: rellena el banco de ideas para los próximos posts (bot/ideas.py -> state/ideas.json).
on:
  schedule: [{ cron: "20 13 * * 0" }]   # domingo 07:20 México
  workflow_dispatch:
concurrency: bot
permissions: { contents: write }
jobs:
  ideas:
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install anthropic requests
      - name: Generar ideas nuevas
        run: |
          set -o pipefail
          python -u -m bot.ideas 2>&1 | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Guardar estado
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add state && git commit -qm "ideas" || true
          git pull --rebase -q && git push -q || true
