name: comments
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
concurrency: bot
permissions: { contents: write }
jobs:
  reply:
    runs-on: ubuntu-24.04
    env:
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      ENABLE_FB_DM: ${{ vars.ENABLE_FB_DM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests
      - run: python -m bot.comments
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add state && git commit -qm "state" || true
          git pull --rebase -q && git push -q || true
